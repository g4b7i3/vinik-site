<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12181e">
<title>Estúdio · Entrar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estúdio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:#12181e;color:#eef0ee;font-family:'DM Sans',system-ui,sans-serif;padding:24px max(18px,env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom))}
  main{width:min(380px,100%);display:grid;gap:22px}
  .marca{display:flex;gap:6px;align-items:flex-end;height:44px}
  .marca i{display:block;width:10px;border-radius:6px}
  h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:52px;line-height:1;margin:0;letter-spacing:-.02em}
  p{margin:0;color:#9aa4ad;font-size:14.5px;line-height:1.5}
  form{display:grid;gap:10px}
  label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#8a949d}
  input{height:52px;border-radius:14px;border:1px solid #2c3742;background:#1b252e;color:#eef0ee;padding:0 16px;font:inherit;font-size:17px}
  input:focus{outline:3px solid rgba(214,142,114,.45);outline-offset:1px;border-color:#d68e72}
  button{height:52px;border-radius:14px;border:0;background:#eef0ee;color:#12181e;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
  .erro{color:#f0a08a;min-height:1.3em;font-size:14px}
</style>
</head>
<body>
<main>
  <div class="marca" aria-hidden="true"><i style="height:55%;background:#ba745b"></i><i style="height:85%;background:#5b8cff"></i><i style="height:65%;background:#5fae6e"></i><i style="height:100%;background:#e0773d"></i></div>
  <div>
    <h1>Estúdio</h1>
    <p>Espaço de estudo do Vinik. Digite a senha uma vez neste aparelho; depois ele lembra.</p>
  </div>
  <form method="post" action="entrar">
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required autofocus>
    <input type="hidden" name="volta" id="volta">
    <p class="erro" id="erro" role="alert"></p>
    <button type="submit">Entrar</button>
  </form>
</main>
<script>
  var q = new URLSearchParams(location.search);
  document.getElementById('volta').value = q.get('volta') || '/estudo/';
  if (q.get('erro')) document.getElementById('erro').textContent = 'Senha errada. Tente de novo.';
</script>
</body>
</html>
