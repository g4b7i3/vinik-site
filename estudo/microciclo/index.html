.voltar{display:inline-flex;align-items:center;gap:4px;margin-bottom:10px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font:700 12.5px var(--body)}
.copia{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: planilha de microciclo de treinador — abas no topo, volume semanal por área como barras de carga, blocos por dia */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --ink:#1b211d; --muted:#5f6b63; --line:#d9dfd8; --accent:#0f6b4f;
  --a-treino:#c4561d; --a-facul:#2b5fa8; --a-escrita:#8a2f4e; --a-leitura:#3d7a2e; --a-codigo:#6a3fa0; --a-proprio:#b8860b; --a-pessoal:#5b6670; --a-teal:#147a80; --a-rosa:#c2417a;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1b201d; --ink:#e8ede9; --muted:#9aa69e; --line:#2e3631; --accent:#4cc39a;
  --a-treino:#f0834a; --a-facul:#6b9cec; --a-escrita:#d9739a; --a-leitura:#82c46e; --a-codigo:#a988e0; --a-proprio:#e0b443; --a-pessoal:#9aa6b0; --a-teal:#4fc1c6; --a-rosa:#ee7fae; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1b201d; --ink:#e8ede9; --muted:#9aa69e; --line:#2e3631; --accent:#4cc39a;
  --a-treino:#f0834a; --a-facul:#6b9cec; --a-escrita:#d9739a; --a-leitura:#82c46e; --a-codigo:#a988e0; --a-proprio:#e0b443; --a-pessoal:#9aa6b0; --a-teal:#4fc1c6; --a-rosa:#ee7fae; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
body.travado{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,36px);letter-spacing:-.02em;margin:0;text-wrap:balance}
.date{font-family:var(--mono);font-size:14px;color:var(--muted)}
.sync{font-size:14px;color:var(--muted);margin-top:2px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:12px;margin-top:8px;border-bottom:1px solid var(--line)}
nav button{flex:0 0 auto;font:700 16px var(--body);color:var(--muted);background:transparent;border:1px solid transparent;border-radius:999px;padding:9px 16px;min-height:44px;cursor:pointer}
nav button[aria-selected="true"]{color:var(--bg);background:var(--ink)}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{display:grid;gap:18px;padding-top:18px}
h2{font-family:var(--display);font-weight:700;font-size:23px;margin:0;letter-spacing:-.01em}
h3{font-family:var(--display);font-weight:700;font-size:17px;margin:0}
.label{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:14px;min-width:0;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}
.note{font-size:15px;color:var(--muted);margin:0}
input,select{font:16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;min-width:0}
input[type=time]{font-family:var(--mono);font-size:16px}
input[type=checkbox]{min-height:0;width:22px;height:22px;accent-color:var(--accent)}
.grow{flex:1 1 160px}
.btn{font:700 16px var(--body);border-radius:10px;padding:10px 18px;min-height:44px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.icon{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:4px 6px;border-radius:6px;line-height:1}
.icon:hover{color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;background:var(--c)}
/* Hoje */
.agenda{display:grid;gap:0}
.slot{display:grid;grid-template-columns:auto 4px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.slot:first-child{border-top:none}
.slot .t{font-family:var(--mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;width:104px}
.slot .bar{align-self:stretch;background:var(--c);border-radius:2px}
.slot.done .txt{text-decoration:line-through;color:var(--muted)}
.slot.now{background:color-mix(in srgb,var(--accent) 9%,transparent);margin-inline:-16px;padding-inline:16px}
.chk{width:28px;height:28px;border-radius:6px;border:2px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--bg);font-size:13px;padding:0}
.chk.on{background:var(--accent);border-color:var(--accent)}
.task{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:none}
.task.done .tx{text-decoration:line-through;color:var(--muted)}
.tx{min-width:0;overflow-wrap:anywhere}
.tag{font-size:14px;color:var(--muted);font-family:var(--mono)}
.tag.late{color:#c0392b}
.star{color:var(--muted)} .star.on{color:var(--a-proprio)}
/* Carga */
.load{display:grid;gap:8px}
.lrow{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;font-size:16px}
.track{height:10px;background:color-mix(in srgb,var(--line) 70%,transparent);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--c);border-radius:5px}
.hrs{font-family:var(--mono);font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
/* Semana */
.week{display:grid;grid-template-columns:repeat(7,minmax(138px,1fr));gap:8px;overflow-x:auto;padding-bottom:6px}
.day{display:grid;gap:6px;align-content:start;min-width:0}
.day h3{font-size:16px;padding:4px 2px;border-bottom:2px solid var(--line)}
.day.today h3{border-color:var(--accent);color:var(--accent)}
.blk{border-left:4px solid var(--c);background:var(--surface);border-radius:0 8px 8px 0;padding:8px 10px;font-size:15px;cursor:pointer;text-align:left;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--ink);font-family:var(--body);width:100%}
.blk b{display:block;font-family:var(--mono);font-weight:500;font-size:13px;color:var(--muted)}
.blk.sel{outline:2px solid var(--c)}
.wrapx{overflow-x:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15px}
.legend span{display:flex;align-items:center;gap:6px}
/* Projetos */
.proj{display:grid;gap:10px}
.proj-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.proj-head input.name{font:700 17px var(--display);border:1px solid transparent;background:transparent;padding:4px 6px;flex:1 1 180px}
.proj-head input.name:hover{border-color:var(--line)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--c)}
/* Dia típico */
.tip{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line);font-size:16px}
.tip:first-child{border-top:none}
.tip .dot{align-self:center}
.tip .meta{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;text-align:right}
.tip .note{grid-column:2 / -1}
.tip .tbar,.tip .chips{grid-column:2 / -1}
.tip .meta b{font-weight:700;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.chip{font:600 13px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
.chip:disabled{opacity:.35;cursor:default}
.tag.ok{color:var(--c)}
details.note summary{cursor:pointer;padding:6px 0}
/* Dia típico */
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tot{display:grid;justify-items:end;text-align:right}
.big2{white-space:nowrap;font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px}
.icon.lg{font-size:26px;width:44px;height:44px;display:grid;place-items:center;border-radius:10px}
.datepill{position:relative;flex:1;text-align:center;font:700 17px var(--body);padding:8px;border-radius:10px;cursor:pointer;text-transform:capitalize}
.datepill input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;min-height:0}
.itens{display:grid;gap:10px}
.item{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"d n v" "b b b";gap:10px 12px;align-items:center;text-align:left;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer;transition:border-color .15s,transform .1s}
button.item:hover{border-color:var(--c)}
button.item:active{transform:scale(.99)}
.item .dot{grid-area:d;width:12px;height:12px}
.item .nm{grid-area:n;font-weight:700;font-size:17px;display:grid;line-height:1.25}
.item small{font-weight:400;font-size:14px;color:var(--muted)}
.item.ok small:first-of-type{color:var(--c);font-weight:700}
.item .val{grid-area:v;display:grid;justify-items:end;line-height:1.2}
.item .val b{font:700 18px var(--mono);font-variant-numeric:tabular-nums}
.item.fixo{cursor:default;grid-template-areas:"d n v"}
.item.fixo .val{font:700 16px var(--mono)}
.bar2{grid-area:b;display:block;height:10px;border-radius:5px;background:color-mix(in srgb,var(--line) 80%,transparent);overflow:hidden}
.bar2 i{display:block;height:100%;border-radius:5px;background:var(--c);transition:width .3s}
.minimo{display:grid;gap:4px;padding:14px 16px;border-radius:14px;background:color-mix(in srgb,var(--accent) 8%,transparent);font-size:16px}
/* folha de registro */
.veu{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;animation:aparece .15s}
.folha{position:fixed;z-index:21;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;box-shadow:0 -8px 40px rgba(0,0,0,.2);animation:sobe .2s ease-out}
@media (min-width:640px){.folha{left:50%;right:auto;bottom:50%;transform:translate(-50%,50%);width:520px;border-radius:22px;animation:aparece .15s}}
.folha>*{min-width:0}
.folha .bar2{grid-area:auto}
.fhead{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.fhead .dot{width:14px;height:14px}
.fnum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fnum .big2{font-size:40px;color:var(--c)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tbtn{font:700 18px var(--mono);min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.tbtn:active{background:color-mix(in srgb,var(--c) 18%,var(--bg));border-color:var(--c)}
.outro{display:grid;grid-template-columns:1fr auto auto;gap:8px}
.outro input{font:700 22px var(--mono);text-align:center;letter-spacing:.04em}
@media (max-width:400px){.outro{grid-template-columns:1fr 1fr}.outro input{grid-column:1 / -1}}
@keyframes sobe{from{transform:translateY(40px);opacity:.4}}
@keyframes aparece{from{opacity:0}}
.grade{border-collapse:separate;border-spacing:3px;width:100%;font-size:15px}
.grade th{font-weight:600;text-align:left;font-size:14px;line-height:1.2}
.grade thead th{text-align:center;font-family:var(--mono);font-weight:500;color:var(--muted);font-size:13px}
.grade thead th .icon{font:inherit;color:inherit;padding:2px 4px}
.grade thead th.hj{color:var(--accent)}
.grade td{text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:-.02em;border-radius:6px;height:36px;min-width:34px;padding:0 1px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cdia{font-size:13px;color:var(--muted);text-align:center;font-family:var(--mono)}
.cel{display:grid;gap:5px;padding:8px 4px;min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:500 15px var(--mono);cursor:pointer;text-align:center;position:relative}
.cel i{display:block;height:4px;border-radius:2px;background:var(--accent);justify-self:start}
.cel:disabled{opacity:.35;cursor:default}
.cel.hj{border-color:var(--accent);color:var(--accent)}
.icon:disabled{opacity:.3;cursor:default}
details.note p{margin-top:6px}
/* Leitura */
.book{display:grid;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.book:first-child{border-top:none}
.book .pg{font-family:var(--mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.pginput{width:84px;font-family:var(--mono)}
.empty{padding:16px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:16px}
.big{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:16px}
.edit{display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.edit input{background:var(--surface)}
.tx.click{cursor:pointer}
.dayv{width:80px;font-family:var(--mono);text-align:right;padding:4px 6px}
.arow{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center}
@media (max-width:520px){.lrow{grid-template-columns:90px 1fr 42px}.slot .t{width:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <a class="voltar" href="../">‹ Estúdio</a>
  <header>
    <div>
      <h1>Microciclo do Vinik</h1>
      <div class="sync" id="sync">Carregando…</div>
    </div>
    <div class="date" id="date"></div>
  </header>
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="hoje" aria-selected="true">Hoje</button>
    <button role="tab" data-tab="semana" aria-selected="false">Semana</button>
    <button role="tab" data-tab="projetos" aria-selected="false">Projetos</button>
    <button role="tab" data-tab="leitura" aria-selected="false">Leitura e escrita</button>
    <button role="tab" data-tab="historico" aria-selected="false">Histórico</button>
  </nav>
  <main id="view"></main>
</div>

<script>
const DEF_AREAS={
  treino:{nome:"Alunos",c:"--a-treino"},
  facul:{nome:"Faculdade",c:"--a-facul"},
  escrita:{nome:"Escrita",c:"--a-escrita"},
  leitura:{nome:"Leitura",c:"--a-leitura"},
  codigo:{nome:"Programação",c:"--a-codigo"},
  proprio:{nome:"Meu treino",c:"--a-proprio"},
  pessoal:{nome:"Pessoal",c:"--a-pessoal"}
};
const CORES={"--a-treino":"Laranja","--a-facul":"Azul","--a-escrita":"Vinho","--a-leitura":"Verde","--a-codigo":"Roxo","--a-proprio":"Mostarda","--a-pessoal":"Cinza","--a-teal":"Azul-petróleo","--a-rosa":"Rosa"};
let AREAS=JSON.parse(JSON.stringify(DEF_AREAS));
function prep(){if(!S.areas)S.areas=JSON.parse(JSON.stringify(DEF_AREAS));if(!S.areas.pessoal)S.areas.pessoal={nome:"Pessoal",c:"--a-pessoal"};AREAS=S.areas}
const DIAS=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
const DIAS_LONGO=["segunda","terça","quarta","quinta","sexta","sábado","domingo"];
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,"0");
const hoje=new Date();
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const HOJE=iso(hoje);
const DIA=(hoje.getDay()+6)%7;
const mins=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cvar=a=>`--c:var(${(AREAS[a]||AREAS.pessoal).c})`;

function modelo(){
  const b=[];const add=(dias,ini,fim,area,txt)=>dias.forEach(d=>b.push({id:uid(),dia:d,ini,fim,area,txt}));
  const util=[0,1,2,3,4];
  add(util,"05:30","06:30","escrita","Sessão de escrita");
  add(util,"06:30","09:30","treino","Atendimento e treinos de alunos");
  add([0,2,4],"10:00","12:00","codigo","Projeto 1");
  add([1,3],"10:00","12:00","codigo","Projeto 2");
  add(util,"14:00","16:00","facul","Estudo da faculdade");
  add(util,"16:30","19:30","treino","Atendimento e treinos de alunos");
  add([1,3],"19:45","20:45","proprio","Força");
  add([0,1,2,3,4,5,6],"21:00","22:00","leitura","Leitura");
  add([5],"06:00","08:00","proprio","Longão");
  add([5],"09:00","12:00","escrita","Escrita longa");
  add([6],"09:00","10:00","pessoal","Revisar a semana e montar o próximo microciclo");
  return {v:1,modelo:true,blocos:b,feitos:{},
    projetos:[
      {id:uid(),nome:"Projeto 1",area:"codigo",tarefas:[{id:uid(),txt:"Definir escopo e prazo final",feito:false,prazo:"",foco:true},{id:uid(),txt:"Listar as entregas da primeira semana",feito:false,prazo:"",foco:false}]},
      {id:uid(),nome:"Projeto 2",area:"codigo",tarefas:[{id:uid(),txt:"Definir escopo e prazo final",feito:false,prazo:"",foco:true}]}
    ],
    livros:[],escrita:{meta:3000,reg:{}}};
}

let S=null, tab="hoje", selBloco=null, confirmar=null, ref=null, editT=null, editL=null;
try{const t=localStorage.getItem("mv_tab");if(t)tab=t}catch(e){}
function lerHash(){const h=location.hash.slice(1);if(h==="historico"){tab="historico";histSem=0}else{const m=h.match(/^mes-(\d{4}-\d{2})$/);if(m){tab="historico";histMes=m[1]}}}

/* ---------- persistência ---------- */
const syncEl=document.getElementById("sync");
/* Sincronização: o painel fica no aparelho e numa cópia no próprio site (Netlify Blobs do vinikautor.com.br),
   protegida pela senha do Estúdio. Vale a última alteração. */
const API="../api/estado?app=microciclo";
let saveT=null, enviando=false;
const getL=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}};
const setL=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function save(){
  S.modelo=false;
  setL("mv_estado",JSON.stringify(S)); setL("mv_sujo","1");
  syncEl.textContent="Salvo neste aparelho…";
  clearTimeout(saveT); saveT=setTimeout(enviar,800);
}
async function enviar(){
  if(enviando){clearTimeout(saveT);saveT=setTimeout(enviar,800);return}
  if(getL("mv_sujo","0")!=="1")return;
  enviando=true;
  try{
    const r=await fetch(API,{method:"PUT",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({estado:S})});
    if(r.status===401){syncEl.textContent="Salvo neste aparelho · entre de novo no Estúdio para sincronizar";return}
    if(!r.ok)throw 0;
    const d=await r.json(); setL("mv_em",String(d.em)); setL("mv_sujo","0");
    syncEl.textContent="Sincronizado";
  }catch(e){syncEl.textContent="Salvo neste aparelho · sincroniza quando houver internet"}
  finally{enviando=false}
}
async function puxar(){
  if(getL("mv_sujo","0")==="1"){await enviar();return}
  try{
    const r=await fetch(API,{credentials:"same-origin",cache:"no-store"});
    if(!r.ok)throw r.status;
    const d=await r.json();
    if(d&&d.estado&&Number(d.em)>Number(getL("mv_em","0"))){
      S=d.estado; setL("mv_estado",JSON.stringify(S)); setL("mv_em",String(d.em));
      if(!document.querySelector("#view input:focus,#view select:focus"))render();
    } else if((!d||!d.estado)&&S&&!S.modelo){ setL("mv_sujo","1"); await enviar(); return; }
    syncEl.textContent=S.modelo?"Modelo inicial — edite à vontade":"Sincronizado";
  }catch(e){ syncEl.textContent=e===401?"Salvo neste aparelho · entre de novo no Estúdio para sincronizar":"Salvo neste aparelho · sem conexão agora"; }
}
function local(){try{const s=localStorage.getItem("mv_estado");return s?JSON.parse(s):null}catch(e){return null}}

async function boot(){
  lerHash();
  window.addEventListener("hashchange",()=>{lerHash();render()});
  S=local()||modelo();
  checarPush();
  render();
  syncEl.textContent="Sincronizando…";
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  await puxar();
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")puxar()});
  window.addEventListener("online",puxar);
}

  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="microciclo-"+HOJE+".json";
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function restaurarCopia(arq){
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);const novo=d&&d.formato==="microciclo"?d.estado:d;
      if(!novo||!Array.isArray(novo.blocos)||!Array.isArray(novo.projetos))throw 0;
      if(!confirm("Trocar o painel deste aparelho pela cópia escolhida?"))return;
      S=novo;save();render();syncEl.textContent="Cópia restaurada"}
    catch(e){alert("Esse arquivo não é uma cópia do Microciclo.")}};
  r.readAsText(arq);
}

function metaDe(d,dIso){if(d.k!=="treino")return d.min;const wd=(dataDe(dIso).getDay()+6)%7;const m=S.blocos.filter(b=>b.dia===wd&&b.area==="proprio").reduce((t,b)=>t+Math.max(0,mins(b.fim)-mins(b.ini)),0);return m||60}

function cumprido(dIso){const r=regDe(dIso);const it=ITENS();return it.reduce((t,d)=>t+Math.min(1,(r[d.k]||0)/metaDe(d,dIso)),0)/it.length}

function resumo(dias){ // dias: lista de datas ISO já passadas
  return ITENS().map(d=>{const tot=dias.reduce((t,x)=>t+(regDe(x)[d.k]||0),0);const meta=dias.reduce((t,x)=>t+metaDe(d,x),0);
    const bateu=dias.filter(x=>(regDe(x)[d.k]||0)>=metaDe(d,x)).length;
    return {d,tot,media:dias.length?Math.round(tot/dias.length):0,pct:meta?tot/meta*100:0,bateu}});
}

async function checarPush(){
  if(!("serviceWorker"in navigator)||!("PushManager"in window)||!("Notification"in window)){pushEstado=ehIOS?"ios":"sem-suporte"}
  else if(Notification.permission==="denied")pushEstado="negado";
  else{try{const r=await regSW();const s=r&&await r.pushManager.getSubscription();pushEstado=s?"ativo":"inativo";if(s)enviarAssinatura().catch(()=>{})}catch(e){pushEstado="inativo"}}
  if(tab==="hoje"&&!document.querySelector("#view input:focus,#view select:focus"))render();
}
async function ativarPush(){
  pushEstado="ativando";render();
  try{
    if(await Notification.requestPermission()!=="granted"){pushEstado="negado";render();return}
    const r=await regSW();await navigator.serviceWorker.ready;
    const k=await fetch(PUSH,{credentials:"same-origin",cache:"no-store"});if(!k.ok)throw 0;
    const {chave}=await k.json();
    let s=await r.pushManager.getSubscription();if(!s)s=await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(chave)});
    const ok=await fetch(PUSH,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({sub:s.toJSON(),aparelho:navigator.userAgent.slice(0,120)})});
    if(!ok.ok)throw 0;
    if(!S.notif){S.notif={...NOTIF_PADRAO};save()}
    pushEstado="ativo";
  }catch(e){pushEstado="erro"}
  render();
}
async function desativarPush(){
  try{const r=await regSW();const s=r&&await r.pushManager.getSubscription();
    if(s){await fetch(PUSH,{method:"DELETE",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({endpoint:s.endpoint})}).catch(()=>{});await s.unsubscribe()}
  }catch(e){}
  pushEstado="inativo";render();
}
let pushMsg="";
async function testarPush(){
  pushMsg="Enviando…";render();
  // 1) o próprio aparelho consegue mostrar uma notificação?
  try{const r=await navigator.serviceWorker.ready;await r.showNotification("Microciclo",{body:"Teste deste aparelho.",tag:"teste-local",icon:"../icons/icon-192.png"})}
  catch(e){pushMsg="Este aparelho não conseguiu mostrar a notificação ("+(e&&e.message||e)+"). Confira se as notificações do navegador ou do app estão liberadas nas configurações do celular.";render();return}
  // 2) o site consegue mandar?
  try{
    await enviarAssinatura();
    const r=await fetch(PUSH,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({teste:true})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)pushMsg="O site respondeu com erro "+r.status+(r.status===401?": entre de novo no Estúdio.":".");
    else if(d.enviados)pushMsg=`Você deve receber duas notificações: uma do aparelho e outra do site (enviada para ${d.enviados} de ${d.aparelhos} ${d.aparelhos===1?"aparelho":"aparelhos"}). Se só a primeira chegou, me mande este texto.`;
    else pushMsg="O site não conseguiu entregar: "+(d.falhas||[]).map(f=>`${f.servico} respondeu ${f.status||"sem código"} ${f.erro}`).join(" | ")+". Me mande este texto.";
  }catch(e){pushMsg="Sem conexão com o site agora."}
  render();
}
async function enviarAssinatura(){
  const r=await regSW();const s=r&&await r.pushManager.getSubscription();if(!s)return false;
  const ok=await fetch(PUSH,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({sub:s.toJSON(),aparelho:navigator.userAgent.slice(0,120)})});
  return ok.ok;
}

const proj=id=>S.projetos.find(p=>p.id===id);
view.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el||el.tagName==="INPUT"||el.tagName==="SELECT")return;
  const {act,id,p}=el.dataset;
  switch(act){
    case"feito":{const f=S.feitos[HOJE]||(S.feitos[HOJE]=[]);const i=f.indexOf(id);i<0?f.push(id):f.splice(i,1);
      Object.keys(S.feitos).forEach(k=>{if(k<iso(new Date(hoje.getTime()-14*864e5)))delete S.feitos[k]});save();break}
    case"dmin":{const r=(S.diario||{})[regDia]||{};setDiario(el.dataset.k,(r[el.dataset.k]||0)+Number(el.dataset.m));folhaMsg="";break}
    case"zerar":setDiario(el.dataset.k,0);folhaMsg="";break;
    case"abrir":folha=el.dataset.k;folhaMsg="";render();setTimeout(()=>{const b=document.querySelector(".folha .tbtn");b&&b.focus({preventScroll:true})},30);return;
    case"fecharfolha":folha=null;folhaMsg="";break;
    case"regmove":{const d=dataDe(regDia);d.setDate(d.getDate()+Number(el.dataset.m));const k=iso(d);if(k<=HOJE)regDia=k;break}
    case"tarefa":{const t=proj(p).tarefas.find(t=>t.id===id);t.feito=!t.feito;save();break}
    case"foco":{const t=proj(p).tarefas.find(t=>t.id===id);t.foco=!t.foco;save();break}
    case"deltarefa":{const pr=proj(p);pr.tarefas=pr.tarefas.filter(t=>t.id!==id);save();break}
    case"selbloco":selBloco=selBloco===id?null:id;break;
    case"fechar":selBloco=null;break;
    case"delbloco":S.blocos=S.blocos.filter(b=>b.id!==id);selBloco=null;save();break;
    case"dupbloco":{const b=S.blocos.find(b=>b.id===id);[0,1,2,3,4].forEach(d=>{if(!S.blocos.some(x=>x.dia===d&&x.ini===b.ini&&x.txt===b.txt))S.blocos.push({...b,id:uid(),dia:d})});selBloco=null;save();break}
    case"askdel":confirmar=p;break;
    case"cancel":confirmar=null;break;
    case"delproj":S.projetos=S.projetos.filter(x=>x.id!==p);confirmar=null;save();break;
    case"editT":editT=id;editL=null;break;
    case"editL":editL=id;editT=null;break;
    case"canceledit":editT=null;editL=null;break;
    case"limpaprazo":{const i=document.getElementById("etP");if(i)i.value="";return}
    case"delarea":{const k=el.dataset.k;S.blocos.forEach(b=>{if(b.area===k)b.area="pessoal"});S.projetos.forEach(x=>{if(x.area===k)x.area="pessoal"});delete S.areas[k];confirmar=null;save();break}
    case"baixar":baixarCopia();return;
    case"voltahoje":regDia=HOJE;break;
    case"irdia":regDia=el.dataset.d;tab="hoje";try{localStorage.setItem("mv_tab",tab)}catch(e){}render();setTimeout(()=>{const d=document.getElementById("diatipico");d&&d.scrollIntoView({behavior:"smooth"})},50);return;
    case"hsem":histSem=Math.min(0,histSem+Number(el.dataset.m));break;
    case"hmes":{const[a,m]=histMes.split("-").map(Number);const d=new Date(a,m-1+Number(el.dataset.m),1);const k=d.getFullYear()+"-"+pad(d.getMonth()+1);if(k<=HOJE.slice(0,7))histMes=k;break}
    case"pushon":ativarPush();return;
    case"pushoff":desativarPush();return;
    case"pushteste":testarPush();return;
    case"dellivro":S.livros=S.livros.filter(x=>x.id!==id);confirmar=null;save();break;
    default:return;
  }
  render();
});
view.addEventListener("change",e=>{
  const el=e.target;const {act,id,p}=el.dataset;
  if(act==="mask")return;
  if(act==="regdia"){if(el.value&&el.value<=HOJE)regDia=el.value;render();return}
  if(act==="nopt"){const n=notif();const k=el.dataset.k;n[k]=k==="lembrete"?(el.checked?(n.lembrete||"21:30"):""):el.checked;if(k==="lembrete"&&el.checked&&!n.lembrete)n.lembrete="21:30";S.notif=n;save();render();return}
  if(act==="nhora"){const n=notif();if(el.value){n.lembrete=el.value;S.notif=n;save()}return}
  if(act==="restaurar"){if(el.files[0])restaurarCopia(el.files[0]);el.value="";return}
  if(act==="nome"){proj(p).nome=el.value.trim()||"Sem nome";save();return}
  if(act==="area"){proj(p).area=el.value;save();render();return}
  if(act==="pag"){const l=S.livros.find(l=>l.id===id);l.pag=Math.max(0,Math.min(l.total,+el.value||0));save();render();return}
  if(act==="anome"){S.areas[el.dataset.k].nome=el.value.trim()||"Sem nome";save();render();return}
  if(act==="acor"){S.areas[el.dataset.k].c=el.value;save();render();return}
  if(act==="dia"){const n=Math.max(0,+el.value||0);if(n)S.escrita.reg[el.dataset.d]=n;else delete S.escrita.reg[el.dataset.d];save();render();return}
  if(act==="meta"){S.escrita.meta=Math.max(100,+el.value||3000);save();render();return}
});
view.addEventListener("input",e=>{const el=e.target;if(el.dataset.act==="mask"){el.value=mascara(el.value)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&folha){folha=null;render()}});
view.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;const v=id=>document.getElementById(id).value.trim();
  switch(f.dataset.form){
    case"outro":{const m=lerOutro(v("outroT"));if(m===null||(!m&&e.submitter?.value!=="total")){folhaMsg="Digite um tempo válido, como 0:45 ou 1:20.";render();return}
      const r=(S.diario||{})[regDia]||{};const k=f.dataset.k;
      if(e.submitter&&e.submitter.value==="total"){setDiario(k,m);folhaMsg="Total definido: "+fmtM(m)+"."}else{setDiario(k,(r[k]||0)+m);folhaMsg="Somado: "+fmtM(m)+"."}
      render();return}
    case"bloco":{const ini=v("bIni"),fim=v("bFim");if(!v("bTxt")||mins(fim)<=mins(ini))return;
      const d=v("bDia");const dias=d==="util"?[0,1,2,3,4]:d==="todos"?[0,1,2,3,4,5,6]:[+d];
      dias.forEach(dia=>S.blocos.push({id:uid(),dia,ini,fim,area:v("bArea"),txt:v("bTxt")}));break}
    case"tarefa":{const p=f.dataset.p;if(!v("nt-"+p))return;proj(p).tarefas.push({id:uid(),txt:v("nt-"+p),prazo:v("np-"+p),feito:false,foco:false});break}
    case"editbloco":{const b=S.blocos.find(b=>b.id===f.dataset.id);const ini=v("eIni"),fim=v("eFim");if(!b||!v("eTxt")||mins(fim)<=mins(ini))return;
      Object.assign(b,{dia:+v("eDia"),ini,fim,area:v("eArea"),txt:v("eTxt")});selBloco=null;break}
    case"edittarefa":{const t=proj(f.dataset.p).tarefas.find(t=>t.id===f.dataset.id);if(!v("etT"))return;t.txt=v("etT");t.prazo=v("etP");editT=null;break}
    case"editlivro":{const l=S.livros.find(l=>l.id===f.dataset.id);if(!v("elT")||!(+v("elP")>0))return;l.titulo=v("elT");l.autor=v("elA");l.total=+v("elP");l.pag=Math.min(l.pag,l.total);editL=null;break}
    case"area":{const nome=v("novaArea");if(!nome)return;S.areas["x"+uid()]={nome,c:v("novaCor")};break}
    case"projeto":if(!v("novoProj"))return;S.projetos.push({id:uid(),nome:v("novoProj"),area:"codigo",tarefas:[]});break;
    case"livro":if(!v("lT")||!(+v("lP")>0))return;S.livros.push({id:uid(),titulo:v("lT"),autor:v("lA"),pag:0,total:+v("lP")});break;
    case"palavras":{const n=+v("palHoje");if(!(n>0))return;S.escrita.reg[HOJE]=(S.escrita.reg[HOJE]||0)+n;break}
    default:return;
  }
  save();render();
});
boot();
</script>
