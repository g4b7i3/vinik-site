<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16307a">
<title>Mundo Vinik · Senha</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:#16307a;color:#fff;font-family:'Figtree',system-ui,sans-serif;padding:24px max(18px,env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom));position:relative;overflow:hidden}
  svg.tile{position:fixed;inset:0;width:100%;height:100%;opacity:.14}
  main{position:relative;width:min(400px,100%);background:#fff;color:#151a2b;border-radius:20px;padding:30px 26px;display:grid;gap:18px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:34px;line-height:1.05;margin:0}
  p{margin:0;color:#5d6378;font-size:15px;line-height:1.5}
  form{display:grid;gap:10px}
  label{font-size:13px;font-weight:600;color:#5d6378}
  input{height:50px;border-radius:12px;border:1px solid #dcd9d1;padding:0 14px;font:inherit;font-size:17px}
  input:focus{outline:2px solid #2346a8;border-color:#2346a8}
  button{height:50px;border-radius:12px;border:0;background:#2346a8;color:#fff;font:inherit;font-weight:600;font-size:16px;cursor:pointer}
  button:hover{background:#16307a}
  .erro{color:#c8432a;min-height:1.3em;font-size:14px}
</style>
</head>
<body>
<svg class="tile" aria-hidden="true"><defs><pattern id="az" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="none" stroke="#fff"/><path d="M30 7C36 24 36 24 53 30 36 36 36 36 30 53 24 36 24 36 7 30 24 24 24 24 30 7z" fill="none" stroke="#fff" stroke-width="1.4"/><circle cx="30" cy="30" r="4" fill="#fff"/></pattern></defs><rect width="100%" height="100%" fill="url(#az)"/></svg>
<main>
  <svg width="44" height="44" viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="2" width="36" height="36" rx="6" fill="#2346a8"/><path d="M20 6c3 6 8 8 14 8-6 0-11 2-14 8-3-6-8-8-14-8 6 0 11-2 14-8zm0 16c3 6 8 8 14 8M20 22c-3 6-8 8-14 8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/></svg>
  <div><h1 id="tit">Criar a senha</h1><p style="margin-top:8px" id="sub">Escolha a senha do Mundo Vinik. É ela que vai abrir o app no PC e no celular. Use pelo menos 6 caracteres.</p></div>
  <form method="post" action="criar-senha">
    <div id="boxatual" hidden style="display:grid;gap:10px"><label for="atual">Senha atual</label><input id="atual" name="atual" type="password" autocomplete="current-password"></div>
    <label for="nova">Senha nova</label>
    <input id="nova" name="nova" type="password" autocomplete="new-password" minlength="6" required>
    <label for="confirmar">Repita a senha nova</label>
    <input id="confirmar" name="confirmar" type="password" autocomplete="new-password" minlength="6" required>
    <label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="ver" style="height:auto"> mostrar as senhas</label>
    <div class="erro" id="erro" role="alert"></div>
    <button type="submit" id="bt">Criar senha e entrar</button>
  </form>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const msg = { atual: 'A senha atual não confere.', curta: 'A senha precisa ter pelo menos 6 caracteres.', diferente: 'As duas senhas novas não são iguais.' };
  if (q.get('erro')) document.getElementById('erro').textContent = msg[q.get('erro')] || 'Algo deu errado. Tente de novo.';
  document.getElementById('ver').onchange = e => document.querySelectorAll('input[type=password],input[data-pw]').forEach(i => { i.dataset.pw = 1; i.type = e.target.checked ? 'text' : 'password'; });
  fetch('api/senha-existe', { cache: 'no-store' }).then(r => r.json()).then(d => {
    if (!d.existe) return;
    document.getElementById('tit').textContent = 'Trocar a senha';
    document.getElementById('sub').textContent = 'Digite a senha atual e a nova. Os outros aparelhos vão pedir a senha nova na próxima vez.';
    const b = document.getElementById('boxatual'); b.hidden = false; document.getElementById('atual').required = true; document.getElementById('atual').focus();
    document.getElementById('bt').textContent = 'Trocar senha';
  }).catch(() => {});
</script>
</body>
</html>
