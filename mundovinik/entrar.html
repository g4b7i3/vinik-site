<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16307a">
<title>Mundo Vinik · Entrar</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:#16307a;color:#fff;font-family:'Figtree',system-ui,sans-serif;padding:24px max(18px,env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom));position:relative;overflow:hidden}
  svg.tile{position:fixed;inset:0;width:100%;height:100%;opacity:.14}
  main{position:relative;width:min(400px,100%);background:#fff;color:#151a2b;border-radius:20px;padding:30px 26px;display:grid;gap:18px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:34px;line-height:1.05;margin:0}
  p{margin:0;color:#5d6378;font-size:15px;line-height:1.5}
  form{display:grid;gap:10px}
  label{font-size:13px;font-weight:600;color:#5d6378}
  input{height:50px;border-radius:12px;border:1px solid #dcd9d1;padding:0 14px;font:inherit;font-size:17px}
  input:focus{outline:2px solid #2346a8;border-color:#2346a8}
  button{height:50px;border-radius:12px;border:0;background:#2346a8;color:#fff;font:inherit;font-weight:600;font-size:16px;cursor:pointer}
  button:hover{background:#16307a}
  .erro{color:#c8432a;min-height:1.3em;font-size:14px}
</style>
</head>
<body>
<svg class="tile" aria-hidden="true"><defs><pattern id="az" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="none" stroke="#fff"/><path d="M30 7C36 24 36 24 53 30 36 36 36 36 30 53 24 36 24 36 7 30 24 24 24 24 30 7z" fill="none" stroke="#fff" stroke-width="1.4"/><circle cx="30" cy="30" r="4" fill="#fff"/></pattern></defs><rect width="100%" height="100%" fill="url(#az)"/></svg>
<main>
  <svg width="44" height="44" viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="2" width="36" height="36" rx="6" fill="#2346a8"/><path d="M20 6c3 6 8 8 14 8-6 0-11 2-14 8-3-6-8-8-14-8 6 0 11-2 14-8zm0 16c3 6 8 8 14 8M20 22c-3 6-8 8-14 8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/></svg>
  <div><h1>Mundo Vinik</h1><p style="margin-top:8px">Seus livros, fichas e enredos. Digite a senha uma vez neste aparelho; ele lembra por 10 anos.</p></div>
  <form method="post" action="entrar">
    <label for="senha">Senha (a mesma do Estúdio)</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required autofocus>
    <input type="hidden" name="volta" id="volta" value="/mundovinik/">
    <div class="erro" id="erro" role="alert"></div>
    <button type="submit">Entrar</button>
  </form>
</main>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('erro')) document.getElementById('erro').textContent = 'Senha errada. Tente de novo.';
  if (q.get('volta')) document.getElementById('volta').value = q.get('volta');
</script>
</body>
</html>
