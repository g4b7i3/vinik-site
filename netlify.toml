[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/substack"
  to = "/.netlify/functions/substack"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
